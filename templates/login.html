<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Fitness Pro Gym</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <h1>Welcome Back</h1>

            <p>
                Login to continue your fitness journey
            </p>

            <form method="POST">

                <input 
                    type="email"
                    name="email"
                    placeholder="Enter Your Email"
                    required
                >

                <input 
                    type="password"
                    name="password"
                    placeholder="Enter Your Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <div class="auth-links">

                <p>
                    Don't have an account?
                </p>

                <a href="/register">
                    Create Account
                </a>

            </div>

        </div>

    </div>

</body>

</html>
